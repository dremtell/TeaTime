name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Скачивание кода
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Установка системных зависимостей
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake

      - name: Установка Buildozer и Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Сборка APK
        run: |
          yes | buildozer android debug

      - name: Загрузка APK в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: TeaTime-APK
          path: bin/*.apk
