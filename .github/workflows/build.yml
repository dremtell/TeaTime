name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:latest
      options: --user root

    steps:
      - name: Скачивание кода
        uses: actions/checkout@v4

      - name: Чтение версии из buildozer.spec
        id: ver
        run: |
          APP_VER=$(grep "^version" buildozer.spec | head -n 1 | cut -d'=' -f2 | tr -d ' \r')
          echo "tag=v${APP_VER}" >> $GITHUB_OUTPUT
          echo "title=v${APP_VER} + APK" >> $GITHUB_OUTPUT

      - name: Сборка APK
        env:
          BUILDOZER_WARN_ON_ROOT: 0
        run: |
          git config --global --add safe.directory '*'
          /home/user/.venv/bin/pip install "cython<3.0"
          yes | buildozer -v android debug || true

      - name: Загрузка APK в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: TeaTime-APK-${{ steps.ver.outputs.tag }}
          path: bin/*.apk
          if-no-files-found: error

      - name: Публикация нового релиза APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.title }}
          files: bin/*.apk
